name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  android-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Java JDK versions (LTS: 17, 21 & Non-LTS: 23)
        java-version: [ '17', '21', '23' ]
        # https://adoptium.net/temurin/releases/
        distribution: [ 'temurin' ]

    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: ${{ matrix.distribution }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          # Auto-accept all SDK licenses
          cmdline-tools-version: latest

      - name: Accept Android SDK licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --update || true

      - name: Install required Android SDK components
        run: |
          echo "Installing Android SDK components..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;34.0.0" || echo "Some SDK components may not be available"

      - name: Verify Android SDK setup
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME/ || echo "Android SDK directory listing failed"
          echo "PATH: $PATH"

      # Automatic gradle caching using `actions/cache@v4`
      # https://github.com/gradle/actions/tree/main/setup-gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run test
        run: ./gradlew testDebugUnitTest --parallel --daemon

      - name: Build with Gradle
        run: ./gradlew assembleDebug --parallel --daemon
