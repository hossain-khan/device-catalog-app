name: Test Android Setup

# This workflow tests the Android setup to verify the solution works
on:
  workflow_dispatch:
    inputs:
      test-build:
        description: 'Run full build test'
        required: false
        default: 'true'
        type: boolean

jobs:
  test-android-setup:
    runs-on: ubuntu-latest
    name: Test Android Setup Solution
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          cmdline-tools-version: latest

      - name: Accept Android SDK licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --update || true

      - name: Install required Android SDK components
        run: |
          echo "Installing Android SDK components..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;34.0.0" || echo "Some SDK components may not be available"

      - name: Verify Android SDK setup
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME/ || echo "Android SDK directory listing failed"
          echo "PATH: $PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test Gradle configuration
        run: |
          echo "Testing Gradle configuration..."
          ./gradlew --version
          echo "Testing if AGP can be resolved..."
          ./gradlew help || echo "Gradle help failed - this may indicate AGP resolution issues"

      - name: Test build (if enabled)
        if: ${{ inputs.test-build == 'true' }}
        run: |
          echo "Testing build process..."
          ./gradlew assembleDebug --dry-run || echo "Build test failed"