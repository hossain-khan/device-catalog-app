name: Android Release Build

# Workflow that builds release APK and AAB for:
# 1. Snapshot builds: Each time code changes on main branch
# 2. Release builds: When a GitHub release is published (automatically attaches APK and AAB to release)
# This allows developers and testers to easily download the latest release APK.
# AAB (Android App Bundle) is provided for Google Play Store distribution.
#
# See:
# - https://github.com/hossain-khan/device-catalog-app/tree/main/keystore
# - https://github.com/hossain-khan/device-catalog-app/blob/main/app/build.gradle.kts (signing configuration)

on:
  push:
    branches: [ "main" ]
  # This allows manual triggering of the workflow, which results in making Android Release APK build
  # Go to the "Actions" tab in the repository, select this workflow, and click the "Run workflow" button to run it manually.
  workflow_dispatch:
  # This is triggered when a release is published
  release:
    types: [published]

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to upload release assets
      actions: read    # Required to read workflow artifacts
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Identify build context
        run: |
          echo "🔍 Build context information:"
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "🎉 Building for GitHub release: ${{ github.ref_name }}"
          else
            echo "📦 Building snapshot from main branch"
          fi

      - name: Setup keystore
        run: |
          echo "🔐 Checking keystore configuration..."
          
          # Only decode and use production keystore if secrets are configured
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "✅ Production keystore found in secrets"
            echo "✅ Decoding and setting up production keystore"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/app-release.keystore
            echo "KEYSTORE_FILE=keystore/app-release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "✅ Production signing configuration applied"
          else
            echo "⚠️  WARNING: Production keystore not configured in GitHub secrets!"
            echo "⚠️  KEYSTORE_BASE64 secret is missing"
            echo "⚠️  Falling back to debug keystore for signing"
            echo ""
            echo "ℹ️  To configure production release signing:"
            echo "   1. Go to repository Settings > Secrets and variables > Actions"
            echo "   2. Add the following secrets:"
            echo "      - KEYSTORE_BASE64: Base64-encoded keystore file"
            echo "      - KEYSTORE_PASSWORD: Keystore password"
            echo "      - KEY_ALIAS: Key alias"
            echo "   3. See: https://github.com/${{ github.repository }}/tree/main/keystore"
            echo ""
            # Don't set KEYSTORE_FILE - let build.gradle.kts fall back to debug keystore
            # The build.gradle.kts checks System.getenv("KEYSTORE_FILE") and uses debug keystore when null
          fi

      - name: Ensure gradlew is executable
        run: chmod +x gradlew
        
      - name: Build Release APK and AAB
        run: |
          echo "🏗️  Starting release build process..."
          echo "📦 Building APK and AAB in parallel..."
          ./gradlew assembleRelease bundleRelease --parallel --daemon
          echo "✅ Build completed successfully"
          
      - name: Verify build outputs
        run: |
          echo "🔍 Verifying build outputs..."
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            APK_SIZE=$(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)
            echo "✅ APK found: $APK_SIZE"
          else
            echo "❌ APK not found!"
            exit 1
          fi
          
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            AAB_SIZE=$(du -h app/build/outputs/bundle/release/app-release.aab | cut -f1)
            echo "✅ AAB found: $AAB_SIZE"
          else
            echo "❌ AAB not found!"
            exit 1
          fi

      - name: Extract version name
        id: version
        run: |
          echo "🔍 Extracting version information from build.gradle.kts..."
          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          echo "VERSION=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "✅ App version: $VERSION_NAME"

      - name: Rename APK and AAB
        run: |
          echo "📝 Renaming build artifacts with version ${{ steps.version.outputs.VERSION }}..."
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/android-catalog-${{ steps.version.outputs.VERSION }}.apk
          cp app/build/outputs/bundle/release/app-release.aab artifact/android-catalog-${{ steps.version.outputs.VERSION }}.aab
          echo "✅ Artifacts renamed successfully"
          ls -lh artifact/

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-catalog-apk
          path: artifact/android-catalog-${{ steps.version.outputs.VERSION }}.apk
          # Use maximum allowed retention period
          # https://github.com/actions/upload-artifact?tab=readme-ov-file#retention-period
          retention-days: 90

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-catalog-aab
          path: artifact/android-catalog-${{ steps.version.outputs.VERSION }}.aab
          retention-days: 90

      - name: Log artifact upload summary
        run: |
          echo "📦 Build artifacts uploaded successfully:"
          echo "   - APK: android-catalog-${{ steps.version.outputs.VERSION }}.apk (90 day retention)"
          echo "   - AAB: android-catalog-${{ steps.version.outputs.VERSION }}.aab (90 day retention)"
          echo ""
          echo "ℹ️  Download artifacts from the Actions tab of this workflow run"

      # If this is running due to a GitHub release, attach the APK and AAB to the release
      - name: Attach APK and AAB to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🎉 Attaching APK and AAB to GitHub release ${{ github.ref_name }}..."
          
          # Get release information
          echo "🔍 Fetching release information..."
          RELEASE_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" | \
            jq -r .id)
          
          if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "❌ Could not find release for tag ${{ github.ref_name }}"
            exit 1
          fi
          
          echo "✅ Found release ID: $RELEASE_ID"
          
          # Upload APK to the release
          APK_FILE="artifact/android-catalog-${{ steps.version.outputs.VERSION }}.apk"
          APK_NAME="android-catalog-${{ steps.version.outputs.VERSION }}.apk"
          
          echo "📤 Uploading $APK_NAME to release..."
          
          UPLOAD_RESPONSE=$(curl -s -w "%{http_code}" -o upload_response.json \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$APK_FILE" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$APK_NAME")
          
          HTTP_CODE="${UPLOAD_RESPONSE: -3}"
          
          if [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Successfully attached APK to GitHub release"
            DOWNLOAD_URL=$(jq -r .browser_download_url upload_response.json)
            echo "📥 APK download URL: $DOWNLOAD_URL"
          else
            echo "❌ Failed to upload APK (HTTP $HTTP_CODE)"
            cat upload_response.json
            exit 1
          fi
          
          # Upload AAB to the release
          AAB_FILE="artifact/android-catalog-${{ steps.version.outputs.VERSION }}.aab"
          AAB_NAME="android-catalog-${{ steps.version.outputs.VERSION }}.aab"
          
          echo "📤 Uploading $AAB_NAME to release..."
          
          UPLOAD_RESPONSE=$(curl -s -w "%{http_code}" -o upload_response_aab.json \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$AAB_FILE" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$AAB_NAME")
          
          HTTP_CODE="${UPLOAD_RESPONSE: -3}"
          
          if [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Successfully attached AAB to GitHub release"
            DOWNLOAD_URL=$(jq -r .browser_download_url upload_response_aab.json)
            echo "📥 AAB download URL: $DOWNLOAD_URL"
          else
            echo "❌ Failed to upload AAB (HTTP $HTTP_CODE)"
            cat upload_response_aab.json
            exit 1
          fi
