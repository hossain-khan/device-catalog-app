name: APK Size Analysis with Diffuse

on:
  pull_request:
    branches: [ "main" ]

jobs:
  diffuse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Required to post comments

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: pr

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup keystore for both builds
        run: |
          # Use debug keystore for both builds to ensure consistent comparison
          # This ensures both APKs are built with identical build parameters
          echo "ℹ️ Using debug keystore for consistent APK size comparison"
          echo "ℹ️ Debug keystore is already configured in app/build.gradle.kts"
          echo "ℹ️ When KEYSTORE_FILE env var is not set, build.gradle.kts falls back to debug keystore"

      # Build base APK from main/base branch
      - name: Build base APK
        working-directory: base
        run: |
          echo "🏗️ Building base APK from ${{ github.base_ref }} branch..."
          ./gradlew assembleRelease --parallel --daemon
          echo "✅ Base APK build completed"

      - name: Copy base APK
        run: |
          cp base/app/build/outputs/apk/release/app-release.apk base.apk
          echo "📦 Base APK copied"

      # Build PR APK
      - name: Build PR APK
        working-directory: pr
        run: |
          echo "🏗️ Building PR APK from ${{ github.head_ref }} branch..."
          ./gradlew assembleRelease --parallel --daemon
          echo "✅ PR APK build completed"

      - name: List APK outputs
        run: |
          echo "📦 Build artifacts:"
          echo "Base APK:"
          ls -lh base.apk
          echo ""
          echo "PR APK:"
          ls -lh pr/app/build/outputs/apk/release/app-release.apk

      # Run Diffuse comparison using the action
      - name: Run Diffuse
        id: diffuse
        uses: usefulness/diffuse-action@v1
        continue-on-error: true
        with:
          old-file-path: base.apk
          new-file-path: pr/app/build/outputs/apk/release/app-release.apk

      # Post or update comment on PR
      - name: Find existing Diffuse comment
        uses: peter-evans/find-comment@v3
        id: find_comment
        if: success() || failure()
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: '📊 APK Size Analysis'

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        if: always()
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## 📊 APK Size Analysis
            
            Comparing `${{ github.base_ref }}` (base branch) → `${{ github.head_ref }}` (this PR)
            
            Both APKs built with identical parameters for accurate comparison.
            
            ${{ steps.diffuse.outputs.diff-gh-comment || '⚠️ Diffuse analysis failed. Check the workflow logs for details.' }}
            
            ---
            _Generated by [Diffuse](https://github.com/JakeWharton/diffuse) via [diffuse-action](https://github.com/usefulness/diffuse-action)_

      # Upload APKs as artifacts for manual inspection
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apks-comparison
          path: |
            base.apk
            pr/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
