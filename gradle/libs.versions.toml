[versions]
activityCompose = "1.12.2"

# The custom parser library for parsing the Android Device Catalog in CSV.
# https://github.com/hossain-khan/android-device-catalog-parser
androidDeviceCatalogParser = "1.8"

composeLintChecks = "1.4.2"

androidxPaging = "3.3.6"

# https://developer.android.com/build/releases/gradle-plugin
# https://developer.android.com/studio/releases#android_gradle_plugin_and_android_studio_compatibility
agp = "9.1.0"
circuit = "0.36.1"

# Coil - Image loading library for Android backed by Kotlin Coroutines
# https://coil-kt.github.io/coil/
coil = "3.5.0"

composeBom = "2025.11.01"
material3 = "1.5.0-alpha26"
coreKtx = "1.17.0"
espressoCore = "3.7.0"
googleFonts = "1.9.5"
junit = "4.13.2"
kotlinxSerialization = "1.9.0"
junitVersion = "1.3.0"

# https://kotlinlang.org/docs/releases.html
kotlin = "2.4.10"
kotlinxCoroutines = "1.9.0"
# The KSP (Kotlin Symbol Processing) plugin version must align with the Kotlin compiler version
ksp = "2.3.6"

# Kotlin linter with built-in formatter
# https://github.com/jeremymailen/kotlinter-gradle
# https://github.com/pinterest/ktlint
kotlinter = "5.3.0"
lifecycleRuntimeKtx = "2.11.0"
metro = "1.4.1"
androidxWork = "2.11.0"
androidxWindowManager = "1.5.1"

# Splash Screen API - https://developer.android.com/develop/ui/views/launch/splash-screen
coreSplashscreen = "1.2.0"

# Security - https://developer.android.com/jetpack/androidx/releases/security
securityCrypto = "1.1.0"

# AppCompat for language preferences
# https://developer.android.com/jetpack/androidx/releases/appcompat
appcompat = "1.7.1"

# DataStore - Modern data storage solution
# https://developer.android.com/jetpack/androidx/releases/datastore
datastore = "1.1.1"

# Room Database
# https://developer.android.com/training/data-storage/room
roomDb = "2.8.4"

[libraries]
android-device-catalog-parser = { module = "com.github.hossain-khan:android-device-catalog-parser", version.ref = "androidDeviceCatalogParser" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-material3-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class", version.ref = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

# Circuit - ⚡️A Compose-driven architecture for Kotlin and Android applications.
# https://github.com/slackhq/circuit/releases
circuit-codegen = { group = "com.slack.circuit", name = "circuit-codegen", version.ref = "circuit" }
circuit-codegen-annotations = { group = "com.slack.circuit", name = "circuit-codegen-annotations", version.ref = "circuit" }
circuit-foundation = { group = "com.slack.circuit", name = "circuit-foundation", version.ref = "circuit" }
circuit-overlay = { group = "com.slack.circuit", name = "circuit-overlay", version.ref = "circuit" }
circuitx-android = { group = "com.slack.circuit", name = "circuitx-android", version.ref = "circuit" }
circuitx-effects = { group = "com.slack.circuit", name = "circuitx-effects", version.ref = "circuit" }
circuitx-gestureNav = { group = "com.slack.circuit", name = "circuitx-gesture-navigation", version.ref = "circuit" }
circuitx-overlays = { group = "com.slack.circuit", name = "circuitx-overlays", version.ref = "circuit" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# Room Database
# https://developer.android.com/training/data-storage/room
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomDb" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomDb" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomDb" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "roomDb" }

javax-inject = { group = "javax.inject", name = "javax.inject", version = "1" }

# # https://developer.android.com/develop/ui/compose/text/fonts
# https://mvnrepository.com/artifact/androidx.compose.ui/ui-text-google-fonts
androidx-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts", version.ref = "googleFonts" }

# Paging 3
# https://developer.android.com/topic/libraries/architecture/paging/v3-overview
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "androidxPaging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "androidxPaging" }
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "roomDb" }

# https://slackhq.github.io/compose-lints/#installation
compose-lint-checks = { module = "com.slack.lint.compose:compose-lint-checks", version.ref = "composeLintChecks" }

# Coil - Image loading library for Compose
# https://coil-kt.github.io/coil/
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# WorkManager - https://developer.android.com/topic/libraries/architecture/workmanager
androidx-work = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidxWork" }

# WindowManager - For foldable device support
# https://developer.android.com/jetpack/androidx/releases/window
androidx-window-manager = { group = "androidx.window", name = "window", version.ref = "androidxWindowManager" }

# Splash Screen API - https://developer.android.com/develop/ui/views/launch/splash-screen
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }

# Security - EncryptedSharedPreferences
# https://developer.android.com/jetpack/androidx/releases/security
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# AppCompat for language preferences
# https://developer.android.com/jetpack/androidx/releases/appcompat
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# DataStore - Modern data storage solution
# https://developer.android.com/topic/libraries/architecture/datastore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

timber = { group = "com.jakewharton.timber", name = "timber", version = "5.0.1" }

# Gradle plugins (for build-logic)
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }

# Add @Parcelize support
# https://plugins.gradle.org/plugin/org.jetbrains.kotlin.plugin.parcelize
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }

# Kotlin Symbol Processing API
# https://kotlinlang.org/docs/ksp-overview.html
# https://github.com/google/ksp/releases
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp"}

androidx-room = { id = "androidx.room", version.ref = "roomDb" }

kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Metro KSP plugin
# https://zacsweers.github.io/metro/
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }

# Kotlin linter with built-in formatter
# https://github.com/jeremymailen/kotlinter-gradle
# https://github.com/pinterest/ktlint
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }
